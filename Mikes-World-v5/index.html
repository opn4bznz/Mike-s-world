<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mike's World</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#071a10;color:#fff;font-family:Arial,sans-serif}
.art{position:relative;height:100vh;background:url("assets/mikes-world-concept.png") center top/cover no-repeat;overflow:hidden}
.grove{position:absolute;width:23%;height:28%;z-index:4;border:0;background:transparent;cursor:pointer;border-radius:45%;transform:translate(0,-50%)}
.grove:hover{box-shadow:0 0 30px rgba(255,220,60,.35);outline:3px solid rgba(255,220,60,.45)}
.g1{left:1%;top:40%}.g2{right:1%;top:40%}.g3{left:1%;top:68%}.g4{right:1%;top:68%}

#hang{position:absolute;z-index:7;left:79.2%;top:8.2%;width:18%;max-width:300px;pointer-events:none;transform-origin:50% 35%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));transition:left 1.2s cubic-bezier(.2,.8,.2,1),top 1.2s cubic-bezier(.2,.8,.2,1),width 1.2s}
#hang img{width:100%;display:block}
.swing{animation:pendulum 2.2s ease-in-out 1}
.beat{animation:beat .18s ease-in-out 6}
@keyframes pendulum{
  0%{transform:rotate(-4deg)}
  25%{transform:rotate(2deg) translateY(-4px)}
  50%{transform:rotate(9deg) translateY(-10px)}
  75%{transform:rotate(2deg) translateY(-4px)}
  100%{transform:rotate(-4deg)}
}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08) translateY(3px)}}

.tunnel{position:fixed;inset:0;z-index:20;display:none;background:radial-gradient(ellipse at center,#6b4b2b 0,#25170e 35%,#050403 75%);overflow:hidden}
.tunnel.on{display:block}
.tunnel:before{content:"";position:absolute;inset:-30%;background:repeating-radial-gradient(ellipse at center,transparent 0 5%,rgba(255,200,90,.08) 5.5% 6%,transparent 6.5% 12%);animation:zoom 3s linear forwards}
#run{position:absolute;left:50%;bottom:10%;width:180px;transform:translateX(-50%) scale(.45);animation:runin 3s ease-in forwards}
#run img{width:100%}
@keyframes zoom{to{transform:scale(2.8)}}
@keyframes runin{0%{transform:translateX(-50%) scale(.4)}100%{transform:translateX(-50%) scale(1.6)}}

.cave{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:5vw;background:radial-gradient(circle,#4e3822,#1c130c 60%,#050403)}
.cave.open{display:grid}
.panel{max-width:1000px;width:100%;max-height:90vh;overflow:auto;padding:42px;border-radius:28px;background:rgba(9,17,11,.94);border:2px solid #cdb54d;box-shadow:0 25px 80px #000;position:relative}
.panel.world-panel{background:linear-gradient(135deg,rgba(8,31,20,.96),rgba(20,58,31,.94) 55%,rgba(8,25,17,.97));overflow:hidden}
.panel.world-panel> *:not(.world-garden){position:relative;z-index:1}
.world-garden{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.95}
.world-garden .vine{position:absolute;width:130px;height:250px;border-left:4px solid #2e8b57;border-bottom:4px solid #2e8b57;border-radius:0 0 0 100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));transform-origin:top left}
.world-garden .vine::before,.world-garden .vine::after{content:"";position:absolute;width:48px;height:24px;background:linear-gradient(135deg,#65c466,#176b45);border-radius:100% 0 100% 0;box-shadow:0 0 0 2px rgba(137,221,111,.2)}
.world-garden .vine::before{left:-25px;top:62px;transform:rotate(-32deg)}
.world-garden .vine::after{left:4px;top:128px;transform:rotate(28deg) scale(.85)}
.world-garden .vine-left{left:-18px;top:8px;transform:rotate(-8deg)}
.world-garden .vine-right{right:-18px;top:18px;transform:scaleX(-1) rotate(-8deg)}
.world-garden .leaf{position:absolute;width:82px;height:40px;background:linear-gradient(135deg,#8bd450,#217346 70%);border-radius:100% 0 100% 0;box-shadow:inset 8px -4px 0 rgba(9,61,39,.35),0 4px 8px rgba(0,0,0,.2)}
.world-garden .leaf-a{left:34px;bottom:26px;transform:rotate(-28deg) scale(1.25)}
.world-garden .leaf-b{right:28px;bottom:72px;transform:rotate(24deg) scale(1.35)}
.world-garden .leaf-c{left:46%;top:8px;transform:rotate(18deg) scale(.9)}
.world-garden .flower{position:absolute;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#ffe58a 0 12%,transparent 14%),radial-gradient(circle at 50% 0,#ff6f91 0 30%,transparent 32%),radial-gradient(circle at 100% 50%,#ff9f1c 0 30%,transparent 32%),radial-gradient(circle at 50% 100%,#e94f9a 0 30%,transparent 32%),radial-gradient(circle at 0 50%,#ff7f51 0 30%,transparent 32%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.world-garden .flower-one{left:12%;top:34%;transform:scale(1.15)}
.world-garden .flower-two{right:13%;top:42%;transform:scale(.85) rotate(18deg)}
.world-garden .flower-three{left:48%;bottom:18%;transform:scale(1.35) rotate(-12deg)}
.pirate{position:absolute;right:7%;bottom:18px;width:145px;height:245px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));transform:scale(.9);transform-origin:bottom right}
.pirate .hat{position:absolute;top:0;left:29px;width:82px;height:28px;background:#17141a;border-radius:50% 50% 18% 18%;transform:rotate(-5deg);z-index:3}
.pirate .hat::before{content:"";position:absolute;left:-14px;top:20px;width:110px;height:13px;background:#111016;border-radius:50%;box-shadow:0 4px 0 #b23a3a}
.pirate .hat::after{content:"";position:absolute;right:9px;top:-13px;width:25px;height:20px;background:#b23a3a;border-radius:50% 50% 0 50%;transform:rotate(28deg)}
.pirate .head{position:absolute;top:29px;left:40px;width:63px;height:67px;background:#d89568;border:3px solid #6b3529;border-radius:46% 46% 42% 42%;z-index:2}
.pirate .head::before{content:"";position:absolute;left:3px;bottom:-11px;width:53px;height:22px;background:#352323;border-radius:0 0 50% 50%;box-shadow:0 -7px 0 #d89568}
.pirate .eye-patch{position:absolute;left:30px;top:16px;width:25px;height:17px;background:#17141a;border-radius:50%;transform:rotate(-8deg);z-index:3}
.pirate .eye-patch::after{content:"";position:absolute;left:-34px;top:8px;width:70px;height:3px;background:#17141a;transform:rotate(7deg)}
.pirate .nose{position:absolute;left:22px;top:33px;width:12px;height:13px;border-right:3px solid #873f32;border-bottom:3px solid #873f32;border-radius:0 0 8px 0;z-index:3}
.pirate .body{position:absolute;top:91px;left:25px;width:92px;height:94px;background:#853b35;border:3px solid #3b2025;border-radius:30px 30px 12px 12px;z-index:1}
.pirate .body::before{content:"";position:absolute;left:35px;top:0;height:88px;border-left:4px solid #e1b75a;box-shadow:10px 0 0 -1px #e1b75a}
.pirate .belt{position:absolute;left:25px;top:157px;width:92px;height:13px;background:#382426;border:2px solid #d19b42;z-index:3;transform:rotate(-2deg)}
.pirate .buckle{position:absolute;left:64px;top:158px;width:15px;height:12px;border:3px solid #e7bc54;z-index:4}
.pirate .arm{position:absolute;top:101px;width:27px;height:79px;background:#853b35;border:3px solid #3b2025;border-radius:18px;z-index:0}
.pirate .arm-left{left:9px;transform:rotate(25deg)}
.pirate .arm-right{right:4px;transform:rotate(-24deg)}
.pirate .hand{position:absolute;top:167px;right:0;width:22px;height:22px;background:#d89568;border:3px solid #6b3529;border-radius:50%;z-index:2}
.pirate .leg{position:absolute;top:177px;width:25px;height:57px;background:#26334b;border:3px solid #171d2b;z-index:0}
.pirate .leg-left{left:46px;border-radius:0 0 8px 8px}
.pirate .peg{position:absolute;left:82px;top:179px;width:25px;height:57px;background:#9b5d30;border:3px solid #55321f;border-radius:5px 5px 50% 50%;transform:rotate(-5deg);z-index:0}
.pirate .peg::after{content:"";position:absolute;left:-11px;bottom:-7px;width:39px;height:15px;background:#6f3c22;border-radius:50%;transform:rotate(5deg)}
.pirate .parrot{position:absolute;top:84px;right:0;width:39px;height:48px;background:#db3f39;border:3px solid #62242c;border-radius:55% 55% 45% 45%;z-index:4;transform:rotate(8deg)}
.pirate .parrot::before{content:"";position:absolute;left:9px;top:-21px;width:24px;height:25px;background:#28a7a0;border:3px solid #176263;border-radius:50% 50% 45% 45%}
.pirate .parrot::after{content:"";position:absolute;left:25px;top:-10px;border-left:12px solid #efb33c;border-top:7px solid transparent;border-bottom:7px solid transparent}
.pirate .parrot-eye{position:absolute;left:24px;top:-13px;width:5px;height:5px;background:#111;border-radius:50%;z-index:5}
.pirate .parrot-feet{position:absolute;left:8px;bottom:-7px;width:22px;border-top:4px solid #e7b83c;z-index:5}
.panel h2{font:700 clamp(2.5rem,5vw,5rem) "Brush Script MT","Segoe Script",cursive;color:#ffd84d;margin:0}
.panel p{font-size:1.1rem;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{padding:18px;border:1px solid #6f6334;border-radius:18px;background:#112419}
.card h3{color:#ffd84d;overflow-wrap:anywhere}
.card.things-past{background:linear-gradient(135deg,#ef476f,#ffd166 48%,#06d6a0);border-color:#fff1a8;color:#24112b;box-shadow:0 8px 24px rgba(239,71,111,.3)}
.card.things-past h3{font:700 2rem "Brush Script MT","Segoe Script",cursive;color:#fff;text-shadow:2px 2px 0 #8d2860,0 0 12px rgba(255,255,255,.7)}
.card.things-past p{color:#24112b;font-weight:700}
.card img,.card video{width:100%;max-height:400px;object-fit:contain;border-radius:12px}
.card audio{width:100%}
.card[data-media="audio"],.card[data-media="video"]{cursor:pointer}
.card[data-media="audio"]:hover,.card[data-media="video"]:hover{border-color:#ffd84d}
.card a{color:#ffd84d;overflow-wrap:anywhere}
.back,.owner-button,.upload,#loginSubmit,#logoutButton{padding:10px 16px;border:0;border-radius:20px;background:#ffd84d;color:#111;font-weight:700;cursor:pointer}
.back{position:absolute;right:16px;top:16px}
.owner-button{margin-bottom:12px}
.upload{display:inline-block;margin:12px 0 22px}
.upload input{display:none}
#loginBox input{margin:4px;padding:10px;border:0;border-radius:8px}
#loginMessage{font-size:.9rem;color:#ffd84d}

@media(max-width:800px){
  .art{height:100vh;height:100dvh;background-size:100% 100%;background-position:center top}
  #hang{width:27%;left:75%;top:8%}
  .cards{grid-template-columns:1fr}
  .grove{width:30%;height:25%}
}
</style>
</head>

<body>
<div class="art">
  <button class="grove g1" data-k="world" aria-label="Mike's World"></button>
  <button class="grove g2" data-k="pics" aria-label="Mike's Pics"></button>
  <button class="grove g3" data-k="movies" aria-label="Movies"></button>
  <button class="grove g4" data-k="music" aria-label="Mike's Music"></button>
  <div id="hang"><img src="assets/hanging-gorilla.png" alt=""></div>
</div>

<div class="tunnel" id="tunnel">
  <div id="run"><img src="assets/hanging-gorilla.png" alt=""></div>
</div>

<div class="cave" id="cave">
  <section class="panel">
    <div class="world-garden" aria-hidden="true">
      <span class="vine vine-left"></span>
      <span class="vine vine-right"></span>
      <span class="leaf leaf-a"></span>
      <span class="leaf leaf-b"></span>
      <span class="leaf leaf-c"></span>
      <span class="flower flower-one"></span>
      <span class="flower flower-two"></span>
      <span class="flower flower-three"></span>
      <div class="pirate" role="img" aria-label="Pirate captain with an eye patch, wooden leg, and parrot">
        <span class="hat"></span><span class="head"><span class="eye-patch"></span><span class="nose"></span></span>
        <span class="body"></span><span class="belt"></span><span class="buckle"></span>
        <span class="arm arm-left"></span><span class="arm arm-right"></span><span class="hand"></span>
        <span class="leg leg-left"></span><span class="peg"></span>
        <span class="parrot"><span class="parrot-eye"></span><span class="parrot-feet"></span></span>
      </div>
    </div>
    <button class="back" id="back">Back</button>

    <button class="owner-button" id="loginButton">Owner login</button>

    <div id="loginBox" hidden>
      <input id="email" type="email" placeholder="Owner email">
      <input id="password" type="password" placeholder="Password">
      <button id="loginSubmit">Log in</button>
      <button id="logoutButton" hidden>Log out</button>
      <p id="loginMessage"></p>
    </div>

    <h2 id="ct"></h2>
    <p id="ci"></p>

    <label class="upload" id="uploadLabel" hidden>
      Upload files
      <input id="fileInput" type="file" multiple>
    </label>

    <div class="cards" id="cards"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const d={
  world:["Mike's World","The main cavern for Mike's interests, stories, favourite things and future blog posts.",["Things Past"]],
  pics:["Mike's Pics","A photo cavern ready for Mike's photographs, captions and featured shots.",["Photo Wall"]],
  movies:["Movies","A cave for reviews, ratings and screenshots.",[]],
  music:["Mike's Music","A cavern for playlists, favourite tracks and the soundtrack to Mike's life.",["Playlists"]]
};

const supabaseClient=window.supabase.createClient(
  "https://dgkwuowjrfgijwoxbnsx.supabase.co",
  "sb_publishable_anHGaHA5U8iDFf-LjWZ2qg_41IfXS6v"
);

const g=document.querySelector("#hang");
const t=document.querySelector("#tunnel");
const c=document.querySelector("#cave");
const panel=document.querySelector(".panel");
const ct=document.querySelector("#ct");
const ci=document.querySelector("#ci");
const cards=document.querySelector("#cards");
const back=document.querySelector("#back");
const loginButton=document.querySelector("#loginButton");
const loginBox=document.querySelector("#loginBox");
const email=document.querySelector("#email");
const password=document.querySelector("#password");
const loginSubmit=document.querySelector("#loginSubmit");
const logoutButton=document.querySelector("#logoutButton");
const loginMessage=document.querySelector("#loginMessage");
const uploadLabel=document.querySelector("#uploadLabel");
const fileInput=document.querySelector("#fileInput");

let currentKey="";
let loggedIn=false;

function go(k,b){
  const r=b.getBoundingClientRect();
  g.style.left=Math.max(2,Math.min(78,(r.left+r.width/2)/innerWidth*100))+"%";
  g.style.top=Math.max(20,Math.min(70,(r.top+r.height*.45)/innerHeight*100))+"%";
  g.classList.remove("swing","beat");
  void g.offsetWidth;
  g.classList.add("swing");
  setTimeout(()=>g.classList.add("beat"),1700);
  setTimeout(()=>{
    t.classList.add("on");
    setTimeout(()=>{
      t.classList.remove("on");
      show(k);
    },3000);
  },1700);
}

async function show(k){
  currentKey=k;
  panel.classList.toggle("world-panel",k==="world");
  ct.textContent=d[k][0];
  ci.textContent=d[k][1];

  cards.innerHTML=d[k][2].map(x=>
    `<div class="card${x==="Things Past"?" things-past":""}"><h3>${x}</h3><p>This section is ready for Mike's real content.</p></div>`
  ).join("");

  const {data,error}=await supabaseClient.storage
    .from("grove-files")
    .list(k,{limit:100,sortBy:{column:"name",order:"asc"}});

  if(error){
    console.error(error);
    c.classList.add("open");
    return;
  }

  data.forEach(file=>{
    const path=`${k}/${file.name}`;
    const {data:publicFile}=supabaseClient.storage
      .from("grove-files").getPublicUrl(path);

    const card=document.createElement("div");
    card.className="card";

    const title=document.createElement("h3");
    title.textContent=file.name;
    card.appendChild(title);

    if(/\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)){
      const image=document.createElement("img");
      image.src=publicFile.publicUrl;
      image.alt=file.name;
      card.appendChild(image);
    }else if(/\.(mp4|webm|mov)$/i.test(file.name)){
      const video=document.createElement("video");
      video.src=publicFile.publicUrl;
      video.controls=true;
      video.preload="metadata";
      video.playsInline=true;
      card.dataset.media="video";
      card.addEventListener("click",event=>{
        if(event.target.closest("video"))return;
        video.paused?video.play():video.pause();
      });
      card.appendChild(video);
    }else if(/\.(mp3|wav|ogg)$/i.test(file.name)){
      const audio=document.createElement("audio");
      audio.src=publicFile.publicUrl;
      audio.controls=true;
      audio.preload="metadata";
      card.dataset.media="audio";
      card.addEventListener("click",event=>{
        if(event.target.closest("audio"))return;
        audio.paused?audio.play():audio.pause();
      });
      card.appendChild(audio);
    }else{
      const link=document.createElement("a");
      link.href=publicFile.publicUrl;
      link.target="_blank";
      link.textContent="Open or download file";
      card.appendChild(link);
    }

    cards.appendChild(card);
  });

  c.classList.add("open");
}

loginButton.onclick=()=>loginBox.hidden=!loginBox.hidden;

loginSubmit.onclick=async()=>{
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  loginMessage.textContent=error?error.message:"Owner logged in.";
};

logoutButton.onclick=async()=>{
  await supabaseClient.auth.signOut();
};

supabaseClient.auth.onAuthStateChange((_event,session)=>{
  loggedIn=Boolean(session);
  uploadLabel.hidden=!loggedIn;
  logoutButton.hidden=!loggedIn;
  loginSubmit.hidden=loggedIn;
  loginMessage.textContent=loggedIn?"Owner is logged in.":"";
});

fileInput.onchange=async event=>{
  if(!loggedIn||!currentKey)return;

  for(const file of event.target.files){
    const safeName=file.name.replace(/[^\w.\- ]/g,"_");
    const path=`${currentKey}/${crypto.randomUUID()}-${safeName}`;

    const {error}=await supabaseClient.storage
      .from("grove-files")
      .upload(path,file);

    if(error)alert("Upload failed: "+error.message);
  }

  fileInput.value="";
  await show(currentKey);
};

document.querySelectorAll(".grove").forEach(b=>{
  b.onclick=()=>go(b.dataset.k,b);
});

back.onclick=()=>c.classList.remove("open");
</script>
</body>
</html>
